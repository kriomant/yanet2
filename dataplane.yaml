dataplane:
  storage: /dev/hugepages/yanet
  # Memory sizes accept a unit suffix: b, k/kb, m/mb, g/gb, t/tb, binary and
  # case-insensitive. Without a suffix dpdk_memory is MiB, which is also its
  # smallest unit, while the instance sizes are bytes.
  dpdk_memory: 1g
  # Maximum self-redirects (recirculations) per packet lineage, shared by the
  # input and output routes; 4..256, default 64. Packets exceeding the budget
  # are dropped and counted in input_recirc_drop / output_recirc_drop.
  packet_recirc_limit: 64
  instances:
    - dp_memory: 1g
      cp_memory: 2g
      numa_id: 0
  devices:
    - port_name: 01:00.0
      mtu: 7000
      max_lro_packet_size: 7200
      rss_hash: 0
      workers:
        - core_id: 1
          instance_id: 0
          rx_queue_len: 1024
          tx_queue_len: 1024
    - port_name: virtio_user_kni0
      mac_addr: 52:54:00:6b:ff:a5
      mtu: 7000
      max_lro_packet_size: 7200
      rss_hash: 0
      workers:
        - core_id: 2
          instance_id: 0
          rx_queue_len: 1024
          tx_queue_len: 1024
  connections:
    - src_device: 01:00.0
      dst_device: virtio_user_kni0
    - src_device: virtio_user_kni0
      dst_device: 01:00.0
